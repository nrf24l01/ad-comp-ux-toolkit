services:
  gitea:
    image: docker.io/gitea/gitea:latest
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: https://gitea.b.local/
      GITEA__server__DOMAIN: gitea.b.local
      GITEA__server__SSH_DOMAIN: gitea.b.local
      GITEA__server__SSH_PORT: "2222"
      GITEA__service__DISABLE_REGISTRATION: "true"
    ports:
      - "2222:22"
    volumes:
      - ./data:/data
    networks:
      - app_net

  databag:
    image: docker.io/balzack/databag:0.1.18
    restart: unless-stopped
    environment:
      ADMIN: ${DATABAG_ADMIN:?Run ./setup.sh 192.168.0.71 first}
    volumes:
      - ./databag-data:/var/lib/databag
    networks:
      - chat_isolated

  nginx:
    image: docker.io/library/nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - gitea
      - databag
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./pki/server.crt:/etc/nginx/certs/server.crt:ro
      - ./pki/server.key:/etc/nginx/certs/server.key:ro
      - ./public:/usr/share/nginx/html:ro
    networks:
      - app_net
      - chat_isolated

networks:
  app_net:
  chat_isolated:
    internal: true
